[project]
name = "alchemist"
version = "0.5.0"
description = "龙虾知识炼金系统 — a self-deployable multi-agent CODE/PARA knowledge system that connects to chat platforms and turns knowledge into content."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
alchemist = "alchemist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alchemist*"]

[tool.setuptools.package-data]
alchemist = ["souls/*.md", "templates/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
